name: Verify portfolio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:content && npm run test:ask
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test -- --dir dist --output .qa-results --browsers chromium,firefox,webkit --widths 320,390,768,1440
      - run: npm run test:responsive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-verification
          path: .qa-results/
          include-hidden-files: true
          retention-days: 14
